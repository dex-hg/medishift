spring.application.name=medishift

# Respuestas de error sin mensajes internos, SQL ni trazas.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Contrato HTTP y límites de lectura. La dirección remota procede del servidor.
server.forward-headers-strategy=none
server.max-http-request-header-size=8KB
server.tomcat.max-parameter-count=32
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=64KB
server.tomcat.connection-timeout=10s
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.factory.constraints.read.max-nesting-depth=24
spring.jackson.factory.constraints.read.max-name-length=256
spring.jackson.factory.constraints.read.max-number-length=64
spring.jackson.factory.constraints.read.max-string-length=8192

medishift.origenes-permitidos=${MEDISHIFT_ORIGENES_PERMITIDOS:http://localhost:5173,http://127.0.0.1:5173}

# Sesión HTTP local: se conserva únicamente mediante cookie.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${MEDISHIFT_COOKIE_SEGURA:false}

# Configuración local en .env, leída como propiedades UTF-8.
spring.config.import=optional:file:./.env[.properties][encoding=utf-8]

spring.datasource.url=${MEDISHIFT_BD_URL:jdbc:postgresql://localhost:5432/MediShift}
spring.datasource.username=${MEDISHIFT_BD_USUARIO:postgres}
spring.datasource.password=${MEDISHIFT_BD_CLAVE}
spring.datasource.driver-class-name=org.postgresql.Driver

# La base ya existe: no ejecutar scripts de creación ni carga de datos.
spring.sql.init.mode=never

# Límites de espera y conexiones para el desarrollo local.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
