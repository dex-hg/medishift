spring.application.name=medishift

# Respuestas de error sin mensajes internos, SQL ni trazas.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Configuración local en .env, leída como propiedades UTF-8.
spring.config.import=optional:file:./.env[.properties][encoding=utf-8]

spring.datasource.url=${MEDISHIFT_BD_URL:jdbc:postgresql://localhost:5432/MediShift}
spring.datasource.username=${MEDISHIFT_BD_USUARIO:postgres}
spring.datasource.password=${MEDISHIFT_BD_CLAVE}
spring.datasource.driver-class-name=org.postgresql.Driver

# La base ya existe: no ejecutar scripts de creación ni carga de datos.
spring.sql.init.mode=never

# Límites de espera y conexiones para el desarrollo local.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
