# Usar el Session pooler de Supabase con la cuenta limitada de la aplicación.
spring.datasource.url=jdbc:postgresql://${MEDISHIFT_SUPABASE_HOST}:5432/postgres?sslmode=verify-full
spring.datasource.username=medishift_app.${MEDISHIFT_SUPABASE_PROYECTO}
spring.datasource.hikari.data-source-properties.sslrootcert=${MEDISHIFT_SUPABASE_CA:/etc/secrets/supabase-ca.crt}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.datasource.hikari.connection-init-sql=SET search_path TO medishift, pg_temp

# Mantener un pool pequeño para el plan gratuito.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# El perfil alojado publica HTTPS y recibe las llamadas del frontend por el proxy /api.
server.servlet.session.cookie.secure=true
medishift.origenes-permitidos=${MEDISHIFT_ORIGENES_PERMITIDOS:}
